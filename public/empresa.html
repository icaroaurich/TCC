<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="shortcut icon" href="images/icon_link.ico">
    <link rel="stylesheet" href="style/app.css">
    <script src="js/comum.js"></script>
    <script src="js/empresa.js" defer></script>
    <title>Conta · Aurich's Management</title>
</head>
<body>
    <header class="topbar">
        <a class="marca" href="painel.html">Aurich's <span>Management</span></a>
        <div class="espaco"></div>
        <a class="link" href="painel.html">← Todas as contas</a>
    </header>

    <main class="pagina">
        <div class="cabecalho" id="cabecalho"></div>

        <div class="duas-colunas">
            <section class="cartao bloco">
                <h2>Nova publicação</h2>
                <form id="formPost">
                    <div class="tipos" id="tipos" role="radiogroup" aria-label="Onde publicar">
                        <label><input type="radio" name="tipo" value="feed" checked><span><strong>Feed</strong><small>Post ou carrossel · ideal 4:5</small></span></label>
                        <label><input type="radio" name="tipo" value="story"><span><strong>Story</strong><small>1 imagem · ideal 9:16</small></span></label>
                    </div>

                    <label class="imagem-area" id="imagemArea">
                        <input type="file" id="imagem" accept="image/jpeg,image/png" multiple>
                        <div class="dica" id="dica">
                            <strong>Escolha as imagens</strong>
                            <span class="small" id="dicaFormato">Clique ou arraste aqui · JPG ou PNG · até 10 (carrossel)</span>
                        </div>
                    </label>
                    <div class="miniaturas" id="miniaturas"></div>
                    <ul class="alertas" id="alertas"></ul>

                    <label class="campo" style="margin-top:16px" id="campoLegenda">
                        <span>Legenda</span>
                        <textarea id="legenda" name="legenda" maxlength="2200" placeholder="Escreva a legenda do post..."></textarea>
                        <small class="contador muted" id="contador">0 / 2200</small>
                    </label>

                    <div class="rodape-form">
                        <label class="campo">
                            <span>Publicar em</span>
                            <input type="datetime-local" id="publicarEm" required>
                        </label>
                        <button class="btn btn-primario" type="submit" id="botaoAgendar">Agendar publicação</button>
                    </div>
                    <p class="aviso" id="mensagem"></p>
                </form>
            </section>

            <section class="cartao bloco">
                <h2>Publicações</h2>
                <div class="abas" id="abas">
                    <button type="button" data-filtro="proximas" class="ativa">Próximas <span class="qtd"></span></button>
                    <button type="button" data-filtro="publicadas">Publicadas <span class="qtd"></span></button>
                    <button type="button" data-filtro="erros">Com erro <span class="qtd"></span></button>
                </div>
                <div class="lista" id="lista"></div>
            </section>
        </div>
    </main>
</body>
</html>
